name: Social weekly recap

# Saturday 11:00 Hong Kong time: the weekend review of the last five brief dates and the signal ledger,
# for the Telegram channel, Threads and X. Also deletes social card folders older than 7 trading days.
# "Run workflow" with dry_run ticked posts nothing and keeps the preview as a downloadable artifact.
on:
  schedule:
    - cron: "0 3 * * 6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: write cards and copy to an artifact, post nothing"
        type: boolean
        default: true
      mode:
        description: "Mode: weekly, daily, premarket or ledger"
        default: weekly

permissions:
  contents: write           # the post log lives on the data branch

concurrency:
  group: premarket-brief-site # never at the same time as the brief or the pre-open update (they write the same branch)
  cancel-in-progress: false

jobs:
  weekly:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_TELEGRAM_PUBLIC == 'true' || vars.ENABLE_TELEGRAM_DRAFTS == 'true' || vars.ENABLE_THREADS == 'true' || vars.ENABLE_X == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STATE_DIR: ${{ github.workspace }}/state
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MODE: ${{ inputs.mode || 'weekly' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL_WRITER: ${{ vars.ANTHROPIC_MODEL_WRITER }}
      ANTHROPIC_MODEL_QA: ${{ vars.ANTHROPIC_MODEL_QA }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
      TELEGRAM_DRAFTS_CHAT_ID: ${{ secrets.TELEGRAM_DRAFTS_CHAT_ID }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      ENABLE_TELEGRAM_PUBLIC: ${{ vars.ENABLE_TELEGRAM_PUBLIC }}
      ENABLE_TELEGRAM_DRAFTS: ${{ vars.ENABLE_TELEGRAM_DRAFTS }}
      ENABLE_THREADS: ${{ vars.ENABLE_THREADS }}
      ENABLE_X: ${{ vars.ENABLE_X }}
      TELEGRAM_PUBLIC_URL: ${{ vars.TELEGRAM_PUBLIC_URL }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
      BRAND_NAME_TC: ${{ vars.BRAND_NAME_TC }}
      BRAND_NAME_SC: ${{ vars.BRAND_NAME_SC }}
      BRAND_NAME_EN: ${{ vars.BRAND_NAME_EN }}
      BRAND_WATERMARK: ${{ vars.BRAND_WATERMARK }}
      BUILD_MODE: ${{ vars.BUILD_MODE }}
    steps:
      - uses: actions/checkout@v7

      - name: Restore history (data branch)
        run: bash runner/state.sh restore

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: social_engine/requirements.txt

      - name: Install packages, Chromium and CJK fonts
        run: |
          pip install -r social_engine/requirements.txt
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-noto-cjk
          sudo apt-get install -y -q fonts-inter || true
          python -m playwright install --with-deps chromium

      - name: Dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python -m social_engine.run_social --mode "$MODE" --dry-run --force

      - name: Keep the preview
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v5
        with:
          name: social-preview
          path: social_preview
          retention-days: 7

      - name: Write, check and post
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        continue-on-error: true
        run: python -m social_engine.run_social --mode "$MODE"

      - name: Save the post log (data branch)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: bash runner/state.sh save "social weekly"
